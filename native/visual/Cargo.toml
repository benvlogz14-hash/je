[package]
name = "euclidean-visual"
version = "0.1.0"
edition = "2021"
description = "Per-pixel work for the Studio preview (transition masks), compiled to WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
