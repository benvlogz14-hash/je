name: Build iPhone app

# Builds an unsigned Euclidean.ipa from mobile/. Sign and install it on your own
# iPhone with Sideloadly or AltStore and a free Apple ID (see README).
on:
  push:
    paths: ['mobile/**', '.github/workflows/ios-app.yml']
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install
        working-directory: mobile
        run: npm ci
      - name: Generate the Xcode project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install && cd ios && pod install
      - name: Build (unsigned)
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry ../../Euclidean.ipa Payload && ls -lh ../../Euclidean.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Euclidean-iPhone
          path: Euclidean.ipa
